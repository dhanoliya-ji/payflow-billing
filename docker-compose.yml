services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payflow
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow
    ports: ["55433:5432"]
    volumes: [payflow-postgres:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U payflow"], interval: 5s, timeout: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    volumes: [payflow-redis:/data]
volumes:
  payflow-postgres:
  payflow-redis:
